<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Проба пера</title>
</head>
<body>
    <div id="Header">
        <h1>Табель Военмех</h1>
    </div>
    <div id="Main">
        <div id="Title">
            <section id="table-num-sect">
                <p id="table-num">Табель №1</p>
                <p>учета использования рабочего времени</p>
                <label for="table-date"></label>
                <select name="table-date" id="table-date"></select>
                <select name="table-year" id="table-year"></select>
            </section>
            
            <section>
                Учреждение: БГТУ "ВОЕНМЕХ" им. Д.Ф.Устинова
            </section>

            <section>
                <label for="department">Структурное подразделение:</label>
                <select name="department" id="department">
                    <!-- Заглушка. Данные будут подтягиваться из БД-->
                    <option value="1" class="dep">1</option>
                    <option value="2" class="dep">2</option>
                    <option value="3" class="dep">3</option>
                    <option value="4" class="dep">4</option>
                    <option value="5" class="dep">5</option>
                </select>
            </section>

            <section>
                <label for="table-var">Вид табеля:</label>
                <select name="table-var" id="table-var">
                    <option value="0" class="dep">0 - первичный</option>
                    <option value="1" class="dep">1 - корректирующий</option>
                    <option value="2" class="dep">2 - др.</option>
                </select>
            </section>
        </div>

        <div id="Table">
            <section id="Table-title">
                <div style="grid-area: num; width: 1em;">№</div>
                <div style="grid-area: fio;">Фамилия, имя отчество</div>
                <div style="grid-area: accNum;">Учетный номер</div>
                <div style="grid-area: space1;"></div>
                <div style="grid-area: space2;"></div>
                <div style="grid-area: prof;">Должность (профессия)</div>
                <div style="grid-area: n1; width: 1em;">1</div>
                <div style="grid-area: n2;">2</div>
                <div style="grid-area: n3;">3</div>
                <div style="grid-area: n4;">4</div>
                <div style="grid-area: n5;">5</div>
                <section id="Table-AllDates-title">
                    <div>Числа месяца</div>
                    <section id="Table-dates-title"></section>
                    <section id="Table-nums-title"></section>
                </section>
                <section id="Table-result-title">
                    <div id="Table-resultT-title">"Итого дней (часов) явок (неявок) с 1 по 15"</div>
                    <div id="Table-result-num">21</div>
                </section>
            </section>

            <section id="Table-Workers-info">
                <div style="grid-area: num;">1</div>
                <div style="grid-area: fio;">Иванов Иван Иванович</div>
                <div style="grid-area: accNum1;"></div>
                <div style="grid-area: accNum2;"></div>
                <div style="grid-area: prof;">Должность</div>
                <div style="grid-area: rate;">1</div>
                <section id="Table-Worker-dates">
          
                </section>
                <div style="grid-area: res;">1</div>
            </section>
        </div>
    </div>
</div>

<div id="Footer"></div>
    <script src="script.js"></script>
</body>
</html>
