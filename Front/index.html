<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Проба пера</title>
</head>
<body>
    <div id="Header">
        <h1>Табель Военмех</h1>
    </div>
    <div id="Main">
        <div id="Title">
            <section id="table-num-sect">
                <p id="table-num">Табель №1</p>
                <p>учета использования рабочего времени</p>
                <label for="table-date"></label>
                <select name="table-date" id="table-date"></select>
                <select name="table-year" id="table-year"></select>
            </section>
            
            <section>
                Учреждение: БГТУ "ВОЕНМЕХ" им. Д.Ф.Устинова
            </section>

            <section>
                <label for="department">Структурное подразделение:</label>
                <select name="department" id="department">
                    <!-- Заглушка. Данные будут подтягиваться из БД-->
                    <option value="1" class="dep">1</option>
                    <option value="2" class="dep">2</option>
                    <option value="3" class="dep">3</option>
                    <option value="4" class="dep">4</option>
                    <option value="5" class="dep">5</option>
                </select>
            </section>

            <section>
                <label for="table-var">Вид табеля:</label>
                <select name="table-var" id="table-var">
                    <option value="0" class="dep">0 - первичный</option>
                    <option value="1" class="dep">1 - корректирующий</option>
                    <option value="2" class="dep">2 - др.</option>
                </select>
            </section>
        </div>

        <div id="Table">
            <div id="table-title">
                <section id="table-info-title">
                    <div style="grid-area: n;">№</div>
                    <div style="grid-area: fio;">Фамилия, имя, отчество</div>
                    <div style="grid-area: uchNum;">Учетный номер</div>
                    <div style="grid-area: prof;">Должность (профессия)</div>
                    <div style="grid-area: uchNum1;"></div>
                    <div style="grid-area: uchNum2;"></div>
                    <!--  Цифры из таблицы, лениво вставлено, согласен  -->
                    <div style="grid-area: a1;">1</div>
                    <div style="grid-area: a2;">2</div>
                    <div style="grid-area: a3;">3</div>
                    <div style="grid-area: a4;">4</div>
                    <div style="grid-area: a5;">5</div>
                </section>
                <section id="table-text-title">
                    <p>Тут "числа месяца"</p>
                </section>
                <section id="table-dates-title">
                    <!--Тут js вставляет все даты в зависимости от выбранного месяца и его части-->
                </section>
                <section id="table-nums-title"></section>
            </div>
        </div>
    </div>
    <div id="Footer"></div>
    <script src="script.js"></script>
</body>
</html>
